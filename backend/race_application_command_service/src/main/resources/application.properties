# Server
server.port=8081

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trailrace_command}
spring.datasource.username=${DB_USERNAME:trailrace}
spring.datasource.password=${DB_PASSWORD:trailrace}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway ? shared scripts come from the shared-db-migrations JAR on classpath
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/shared,classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT
jwt.secret=${JWT_SECRET:a-very-long-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.race=INFO
logging.level.org.springframework.security=WARN

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.app.name=race-application-command-service
management.info.app.version=1.0.0
management.info.app.description=Trail Race CQRS - Write-side service

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


